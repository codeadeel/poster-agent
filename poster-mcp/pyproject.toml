[project]
name = "poster-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=1.28,<2",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
demo = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
